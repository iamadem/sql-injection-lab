---
# Provisioning for the SEED Lab "SQL Injection Attack" for CyberRangeCZ.
#
# The variables secret_task1, secret_task2a, secret_task2b, target_salary_self,
# target_salary_boby, target_password_boby are generated per-sandbox by the platform
# from ../variables.yml and passed as extra vars.
# Default values below are provided as fallbacks for off-platform / local testing.

# Common tools on all hosts (curl, net-tools, vim, nano...)
- name: Configuring hosts
  hosts: hosts
  become: true
  roles:
    - hosts

# Configure the seed machine (student account seed / dees + Docker + SQLi lab)
- name: Configure seed
  hosts: seed
  become: true
  roles:
    - role: user-access
      user_access_username: seed
      user_access_password: dees
      user_access_sudo: false
    - role: seed_lab

# Command logging (identical to Junior Hacker and SEED PRNG templates):
# allows instructors to inspect student commands in the platform.
- name: setup hosts logging roles
  hosts:
    - routers
    - hosts
  become: true
  vars:
    sandbox_name: sqli-seed-lab
    central_syslog_ip: 78.128.251.179
  roles:
    - role: sandbox-logging
      slf_destination_port: '{% if hostvars["man"] is defined -%} 514 {%- else -%} 515 {%- endif %}'
      slf_destination: '{% if hostvars["man"] is defined -%} {{ hostvars["man"].ansible_host }} {%- else -%} {{ central_syslog_ip }} {%- endif %}'
      slf_sandbox_id: "{{ global_sandbox_id | default(student_id) | default(0) }}"
      slf_sandbox_name: '{{ global_sandbox_name | default(sandbox_name) }}'
      slf_pool_id: '{{ global_pool_id | default(None) }}'
